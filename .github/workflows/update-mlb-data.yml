name: Update MLB Data

on:
  schedule:
    # Runs at 10:00 UTC (07:00 ET) every day — after midnight stats are settled
    - cron: '0 10 * * *'
  workflow_dispatch:  # allow manual trigger

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch MLB data
        run: python src/fetch_mlb_data.py

      - name: Commit & push if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/mlb_data.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update MLB data $(date -u '+%Y-%m-%d')"
            git push
          fi
